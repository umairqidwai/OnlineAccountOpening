spring:
  application:
    name: bank-onboarding-service

aws:
  s3:
    endpoint: "http://localhost:9000"
    bucket-name: "bank-docs"
    region: "us-east-1"
    access-key: "admin"
    secret-key: "password123"

# KYC/KYB Document Validation Rules

document:
  upload:
    max-file-size: 5242880 # 5 MB in bytes (5 * 1024 * 1024)
    allowed-types: "application/pdf, image/jpg, image/png"